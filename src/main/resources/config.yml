# ======================================================================== #
#                      SHChatGames - Configuration                         #
# ======================================================================== #
#
# Plugin : mini-jeux de chat automatiques (mot à taper, mot à l'envers,
# calcul, suite, clic) avec récompenses. Avec SHNetwork, un seul jeu tourne pour
# tous les serveurs Opale (voir la section 'reseau' en bas du fichier).
#
# Commandes :
#   /shchatgames reload        Relit config.yml, messages.yml et la liste de mots, et relance le planificateur avec
#                              le nouvel 'interval'. Si config.yml ou messages.yml est invalide, rien n'est remplacé
#                              et le message donne le fichier et l'erreur. Demandent un redémarrage : reseau.actif,
#                              reseau.canal, reseau.base-de-donnees.
#   /shchatgames start [jeu]   Lance un jeu tout de suite (type, unreverse, solve, sequence, click),
#                              sans tenir compte de min-players. Avec SHNetwork, seulement sur le serveur meneur.
#   /shchatgames import        Avec SHNetwork : copie les victoires de wins.yml dans la base du réseau,
#                              sans toucher aux joueurs qui y ont déjà un total.
#   /shchatgames status        Mode, jeu en cours, prochain lancement et joueurs comptés contre min-players.
#   /shcgclick <jeton>         Commande interne exécutée par le clic sur la case du jeu « clic ».
#   Sans argument, /shchatgames affiche la liste des sous-commandes permises.
#
# Permissions :
#   shchatgames.admin          Toutes les sous-commandes de /shchatgames (par défaut : op).
#   shchatgames.admin.reload   /shchatgames reload
#   shchatgames.admin.start    /shchatgames start
#   shchatgames.admin.import   /shchatgames import
#   shchatgames.admin.status   /shchatgames status
#   shchatgames.play           Participer au jeu du clic (par défaut : tous les joueurs).
#
# Placeholder : %shchatgames_wins% = nombre de victoires du joueur (celles de tout le réseau avec SHNetwork).
#
# Les messages des commandes sont dans 'messages.yml'.
#
# ======================================================================== #

# Délai entre deux jeux, en secondes : une valeur fixe (300) ou une plage (480-700).
# Avec SHNetwork, seul le serveur meneur le décompte.
interval: "480-700"

# Nombre minimal de joueurs connectés pour lancer un jeu (tout le réseau avec SHNetwork).
min-players: 10

# Jeux tirés au hasard : type, unreverse, solve, sequence, click.
enabled_games:
  - type
  - unreverse
  - solve
  - sequence
  - click


# Durée d'un jeu, en secondes, avant la fin sans gagnant.
game_timeout_seconds: 60

# Son joué à tous les joueurs au lancement d'un jeu (vide pour aucun son).
game_start_sound: "BLOCK_NOTE_BLOCK_PLING"

# Son joué à tous les joueurs quand un joueur gagne (vide pour aucun son).
game_win_sound: "ENTITY_PLAYER_LEVELUP"

# Fichier SHLogs où sont écrits les gagnants.
log_file: "gagnants"

# Ligne écrite dans SHLogs pour chaque gagnant récompensé.
# Variables : %PLAYER%, %GAME% (log_name du jeu), %REWARD% (reward_log_names du groupe tiré).
win_log_format: "%PLAYER% -> gagne le jeu du chat « %GAME% » (%REWARD%)"

# Textes de chaque jeu (start, win, timeout) et nom du jeu dans SHLogs (log_name).
# Variables : %PLAYER%, %ANSWER%, %GAME_CONTENT%, %TIME%, %WINS%.
games:
  type:
    log_name: "Mot à taper"
    start:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - " &fLe premier qui écrit &d&l%GAME_CONTENT% &fgagne !"
      - ""
    win:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - " &a%PLAYER%&f a écrit &b&l%ANSWER% &fen &d%TIME% &fsec !"
      - ""
    timeout:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - " &eTemps écoulé&f, Personne n'a gagné !"
      - ""

  unreverse:
    log_name: "Mot à l'envers"
    start:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - " &fLe premier qui retourne &d&l%GAME_CONTENT% &fgagne !"
      - ""
    win:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - "&a%PLAYER%&f a retourné &b&l%ANSWER% &fen &d%TIME% &fsec !"
      - ""
    timeout:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - "&eTemps écoulé&f, Personne n'a gagné !"
      - ""

  solve:
    log_name: "Calcul"
    start:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - "&fLe premier qui résout &d&l%GAME_CONTENT% &fgagne !"
      - ""
    win:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - " &a%PLAYER%&f a résolu &b&l%ANSWER% &fen &d%TIME% &fsec !"
      - ""
    timeout:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - " &eTemps écoulé&f, Personne n'a gagné !"
      - ""
  
  sequence:
    log_name: "Suite logique"
    start:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - " &fTrouvez la suite logique : &d&l%GAME_CONTENT%"
      - ""
    win:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
      - " &a%PLAYER%&f a trouvé la suite &b&l%ANSWER% &fen &d%TIME% &fsec !"
      - ""
    timeout:
      - ""
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l»"
