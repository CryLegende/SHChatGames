      - ""
    too_late:
      - "&7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l» &cTrop tard !"

# Récompenses : un groupe est tiré au hasard à chaque victoire, ses commandes sont
# exécutées par la console. %PLAYER% = gagnant.
rewards:
  1:
    - "minecraft:xp add %player% 250"
    - "eco give %player% 3000"
    - "sm %player% &7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l» &fVous avez gagné &a250 EXP &fet &a3000 SHCoins"
  2:
    - "shwc %player% ntdluckyblock give %player% YELLOW 1"
    - "eco give %player% 3000"
    - "sm %player% &7&l« &c&lM&6&li&e&ln&l&li &b&lj&d&le&6&lu &8&l» &fVous avez gagné &a1 luckyblock Jaune &fet &a3000 SHCoins"

# Texte de chaque groupe de récompenses dans SHLogs (même numéro que ci-dessus).
reward_log_names:
  1: "250 EXP et 3000 SHCoins"
  2: "1 luckyblock Jaune et 3000 SHCoins"

# Jeu unique pour tout le réseau Opale. Demande SHNetwork : sans lui, ou avec actif: false, chaque serveur
# lance ses propres jeux et compte les victoires dans wins.yml.
# Un seul serveur, le meneur, tire les jeux et désigne le gagnant ; tous les serveurs affichent la même
# question en même temps et envoient au meneur les bonnes réponses de leurs joueurs. La récompense est donnée
# une seule fois, sur le serveur où se trouve le gagnant.
# Demande un redémarrage : actif, canal, base-de-donnees. Se recharge avec /shchatgames reload : le reste.
reseau:
  actif: true
  # Canal du bus SHNetwork : le meneur y annonce début, victoire et fin ; les réponses des joueurs
  # partent vers le meneur sur <canal>.reponse
  canal: chatgames
  # Temps d'attente, en secondes, après la fin du dernier jeu avant qu'un nouveau meneur en lance un
  marge-reprise-secondes: 5
  # Durée pendant laquelle le nombre de victoires d'un joueur lu en base est gardé en mémoire, en secondes
  cache-victoires-secondes: 30
  # Base partagée par tous les serveurs : victoires dans la table chatgames_wins (uuid, name, wins)
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shchatgames
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas
    # retarde l'annonce du gagnant d'autant, mais jamais sa récompense.
    delai-ms: 3000
