name: SHChatGames
version: '${project.version}'
main: org.Cry_Legende.sHChatGames.SHChatGames
api-version: '1.20'
author: Cry_Legende
depend:
  - PlaceholderAPI
# SHNetwork est facultatif : sans lui, chaque serveur lance ses propres jeux comme avant.
softdepend:
  - SHLogs
  - SHNetwork
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (victoires en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shchatgames:
    description: Administration de SHChatGames.
    permission: shchatgames.admin.reload;shchatgames.admin.start;shchatgames.admin.import;shchatgames.admin.status
    usage: /shchatgames <reload|start [jeu]|import|status>
  shcgclick:
    description: Commande interne declenchee par le clic sur la case.
    permission: shchatgames.play
    usage: /shcgclick <token>

permissions:
  shchatgames.admin:
    description: Toutes les sous-commandes de /shchatgames.
    default: op
    children:
      shchatgames.admin.reload: true
      shchatgames.admin.start: true
      shchatgames.admin.import: true
      shchatgames.admin.status: true
  shchatgames.admin.reload:
    description: Recharger la configuration, les messages et la liste de mots avec /shchatgames reload.
    default: op
  shchatgames.admin.start:
    description: Lancer un jeu tout de suite avec /shchatgames start.
    default: op
  shchatgames.admin.import:
    description: Reprendre les victoires de wins.yml dans la base du réseau avec /shchatgames import.
    default: op
  shchatgames.admin.status:
    description: Voir l'état des jeux du chat avec /shchatgames status.
    default: op
  shchatgames.play:
    description: Permet de participer au mini-jeu du clic.
    default: true
